{% extends 'base.html' %}

{% block content %}
<div class="page-auth">
    <div class="form-card">
        <h1>Criar conta</h1>
        <p class="auth-intro">Cadastre-se para começar a treinar.</p>
        <form action="{{ url_for('auth.cadastro') }}" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" autocomplete="name" required placeholder="Ex: Marlon Silva">
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="new-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Cadastrar</button>
        </form>
        <p class="auth-footer">Já possui conta? <a href="{{ url_for('auth.login') }}">Faça login</a></p>
    </div>
</div>
{% endblock %}
