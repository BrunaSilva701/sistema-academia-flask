{% extends 'base.html' %}

{% block content %}
<div class="page-auth">
    <div class="form-card">
        <h1>Acesse sua conta</h1>
        <p class="auth-intro">Entre para acessar seu perfil.</p>
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Entrar</button>
        </form>
        <p class="auth-footer">Ainda não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
    </div>
</div>
{% endblock %}
